name: Teeball regression tests
on:
  push:
    branches: [feat/teeball-rainy-day]
  pull_request:
    paths:
      - 'src/teeball/**'
      - 'teeball/**'
      - 'tests/teeball*.test.mjs'
      - '.github/workflows/teeball-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.mjs
      - run: node --test packages/taikan-kit/test/*.test.mjs
